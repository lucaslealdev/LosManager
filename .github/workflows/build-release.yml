name: Build e Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Aumentar a resolução da tela virtual do runner
        # windows-latest não tem monitor físico, então roda com uma
        # resolução padrão bem baixa (~1024x768) — pequena demais pro
        # teste de responsividade da tabela (screens/produtos.py)
        # conseguir provar diferença de linhas numa janela grande vs
        # pequena (ver testes/test_tela_produtos_responsividade.py).
        # Troca a resolução via ChangeDisplaySettings (Win32) antes dos
        # testes rodarem; se o driver de vídeo da VM recusar a troca,
        # só avisa no log e segue (o teste em questão já sabe se
        # proteger com um skip nesse caso, não falha o build).
        run: |
          Add-Type -TypeDefinition @"
          using System;
          using System.Runtime.InteropServices;

          public class Resolucao
          {
              [StructLayout(LayoutKind.Sequential)]
              public struct DEVMODE
              {
                  [MarshalAs(UnmanagedType.ByValTStr, SizeConst = 32)]
                  public string dmDeviceName;
                  public short dmSpecVersion;
                  public short dmDriverVersion;
                  public short dmSize;
                  public short dmDriverExtra;
                  public int dmFields;
                  public int dmPositionX;
                  public int dmPositionY;
                  public int dmDisplayOrientation;
                  public int dmDisplayFixedOutput;
                  public short dmColor;
                  public short dmDuplex;
                  public short dmYResolution;
                  public short dmTTOption;
                  public short dmCollate;
                  [MarshalAs(UnmanagedType.ByValTStr, SizeConst = 32)]
                  public string dmFormName;
                  public short dmLogPixels;
                  public int dmBitsPerPel;
                  public int dmPelsWidth;
                  public int dmPelsHeight;
                  public int dmDisplayFlags;
                  public int dmDisplayFrequency;
                  public int dmICMMethod;
                  public int dmICMIntent;
                  public int dmMediaType;
                  public int dmDitherType;
                  public int dmReserved1;
                  public int dmReserved2;
                  public int dmPanningWidth;
                  public int dmPanningHeight;
              }

              [DllImport("user32.dll")]
              public static extern int EnumDisplaySettings(string deviceName, int modeNum, ref DEVMODE devMode);

              [DllImport("user32.dll")]
              public static extern int ChangeDisplaySettings(ref DEVMODE devMode, int flags);

              public static DEVMODE NovoDevMode()
              {
                  DEVMODE dm = new DEVMODE();
                  dm.dmDeviceName = new string(new char[32]);
                  dm.dmFormName = new string(new char[32]);
                  dm.dmSize = (short)Marshal.SizeOf(dm);
                  return dm;
              }

              public const int DM_PELSWIDTH = 0x80000;
              public const int DM_PELSHEIGHT = 0x100000;
          }
          "@

          # O driver de vídeo virtual da VM não suporta enumerar seus
          # modos (EnumDisplaySettings devolveu zero modos numa
          # tentativa anterior, e uma resolução arbitrária -- 1366x2000
          # -- foi recusada com -2/DISP_CHANGE_BADMODE numa tentativa
          # antes dessa). Em vez de enumerar, tenta uma lista de
          # resoluções padrão comuns, da mais alta pra mais baixa, e
          # fica com a primeira que o driver aceitar.
          $candidatas = @(
              @{L=1920; A=1200}, @{L=1600; A=1200}, @{L=1920; A=1080},
              @{L=1680; A=1050}, @{L=1600; A=900},  @{L=1440; A=900},
              @{L=1366; A=1024}, @{L=1280; A=1024}, @{L=1280; A=960}
          )

          $conseguiu = $false

          foreach ($c in $candidatas) {
              $dm = [Resolucao]::NovoDevMode()

              if ([Resolucao]::EnumDisplaySettings($null, -1, [ref]$dm) -eq 0) {
                  Write-Host "EnumDisplaySettings(ENUM_CURRENT_SETTINGS) falhou -- desistindo."
                  break
              }

              $dm.dmPelsWidth = $c.L
              $dm.dmPelsHeight = $c.A
              $dm.dmFields = [Resolucao]::DM_PELSWIDTH -bor [Resolucao]::DM_PELSHEIGHT

              $resultado = [Resolucao]::ChangeDisplaySettings([ref]$dm, 0)
              Write-Host "Tentando $($c.L)x$($c.A) -> resultado $resultado (0 = sucesso)"

              if ($resultado -eq 0) {
                  $conseguiu = $true
                  break
              }
          }

          if (-not $conseguiu) {
              Write-Host "Nenhuma resolução candidata foi aceita -- seguindo com a resolução padrão da VM."
          }
        continue-on-error: true

      - name: Rodar a suíte de testes
        # Roda antes de gerar o executável de propósito: se algo quebrou,
        # a build para aqui e nem chega a compilar/publicar um release
        # ruim. windows-latest tem sessão gráfica própria, então
        # testes/gui_ambiente.py não precisa de Xvfb aqui (só entra em
        # jogo num Linux sem monitor).
        run: python -m testes

      - name: Calcular a versão semântica desta build
        # MAJOR.MINOR vêm do arquivo VERSION (versionado no repositório,
        # ajustado à mão quando uma mudança realmente merece um novo
        # major/minor); PATCH é o número sequencial da própria Action,
        # então toda build ainda gera uma versão nova e única sem
        # precisar editar o VERSION a cada push.
        run: |
          $base = (Get-Content VERSION -Raw).Trim()
          $versao = "$base.${{ github.run_number }}"
          "VERSAO=$versao" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Set-Content -Path assets\versao.txt -Value $versao -NoNewline -Encoding utf8

      - name: Gerar o executável (PyInstaller)
        run: python -m PyInstaller LosManager.spec --clean

      - name: Compactar a build
        run: Compress-Archive -Path dist\LosManager\* -DestinationPath LosManager.zip

      - name: Criar Release no GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSAO }}
          name: "Los Manager — v${{ env.VERSAO }}"
          body: |
            Build automática gerada a partir do commit ${{ github.sha }}.
          files: LosManager.zip
