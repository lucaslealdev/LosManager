name: Build e Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  testes-linux:
    # Roda os testes num Linux com Xvfb (tela virtual de 1366x1400),
    # onde TODOS os testes de GUI passam de verdade — inclusive os de
    # responsividade que no windows-latest pulam por causa da tela
    # pequena (~768px) e da fonte Arial que consome mais espaço.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Instalar Xvfb e dependências de sistema
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Instalar dependências Python
        # pywin32 é só pra impressora térmica no Windows — não é
        # importado por nenhum teste, então não precisa aqui.
        run: pip install customtkinter Pillow

      - name: Rodar a suíte de testes
        run: python -m testes

  build:
    needs: testes-linux
    runs-on: windows-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Calcular a versão semântica desta build
        # MAJOR.MINOR vêm do arquivo VERSION (versionado no repositório,
        # ajustado à mão quando uma mudança realmente merece um novo
        # major/minor); PATCH é o número sequencial da própria Action,
        # então toda build ainda gera uma versão nova e única sem
        # precisar editar o VERSION a cada push.
        run: |
          $base = (Get-Content VERSION -Raw).Trim()
          $versao = "$base.${{ github.run_number }}"
          "VERSAO=$versao" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Set-Content -Path assets\versao.txt -Value $versao -NoNewline -Encoding utf8

      - name: Gerar o executável (PyInstaller)
        run: python -m PyInstaller LosManager.spec --clean

      - name: Compactar a build
        run: Compress-Archive -Path dist\LosManager\* -DestinationPath LosManager.zip

      - name: Criar Release no GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSAO }}
          name: "Los Manager — v${{ env.VERSAO }}"
          body: |
            Build automática gerada a partir do commit ${{ github.sha }}.
          files: LosManager.zip
